<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Kurdistan SkyRadar (Rust)</title>
  <link data-trunk rel="rust" data-wasm-opt="0" data-target-name="radar_app" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07090e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #the_canvas_id {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00f2fe;
      font-family: monospace;
      font-size: 14px;
      letter-spacing: 0.1em;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="loading">STARTING KURDISTAN SKYRADAR (RUST WASM)...</div>
  <canvas id="the_canvas_id"></canvas>
  <script>
    function bootAndRemoveSplash() {
      if (window.wasmBindings && typeof window.wasmBindings.start === 'function') {
        try { window.wasmBindings.start(); } catch (e) { console.error(e); }
      }
      const loading = document.getElementById('loading');
      if (loading) loading.remove();
    }
    window.addEventListener("TrunkApplicationStarted", bootAndRemoveSplash);
    setTimeout(bootAndRemoveSplash, 600);
  </script>
</body>
</html>
