[package]
name = "radar-server"
description = "Kurdistan SkyRadar live flight aggregation server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
radar-core.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
reqwest = { version = "0.13", features = ["json"] }
tower-http = { version = "0.7", features = ["fs", "cors", "compression-gzip"] }
