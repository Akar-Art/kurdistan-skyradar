[workspace]
resolver = "2"
members = ["crates/radar-core", "crates/radar-server", "crates/radar-app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
radar-core = { path = "crates/radar-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Keep the WASM bundle small and fast
[profile.release.package.radar-app]
opt-level = "s"

# Dependencies are optimized even in debug builds so the map stays smooth while developing
[profile.dev.package."*"]
opt-level = 2
